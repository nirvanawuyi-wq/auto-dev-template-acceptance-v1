name: trusted integration schema
on:
  workflow_run:
    workflows: [integration merged]
    types: [completed]
    branches: [integration]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  statuses: read
concurrency:
  group: schema-test
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - env:
          GH_TOKEN: ${{ github.token }}
          MAINTAINER_GITHUB_LOGIN: ${{ vars.MAINTAINER_GITHUB_LOGIN }}
        run: node .github/scripts/trusted-release.mjs integration
      - uses: actions/upload-artifact@v4
        with:
          name: verified-integration-input
          path: verified-releases.json
          if-no-files-found: error
  rehearse:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: verified-integration-input
      - env:
          SUPABASE_TELEMETRY_DISABLED: '1'
          LOCAL_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/scripts/local-roles.sql
          node .github/scripts/migrate-schema.mjs local verified-releases.json expected.ts '' expected
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/scripts/local-permissions.sql
          supabase gen types typescript --db-url "$LOCAL_DATABASE_URL" --schema business_test > generated-local.ts
          node .github/scripts/normalize-cli-types.mjs generated-local.ts business_test expected/supabase.ts
      - uses: actions/upload-artifact@v4
        with:
          name: trusted-rehearsal-types
          path: expected/
          if-no-files-found: error
  migrate:
    needs: rehearse
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: db-admin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: verified-integration-input
      - uses: actions/download-artifact@v4
        with:
          name: trusted-rehearsal-types
          path: expected
      - env:
          SUPABASE_TELEMETRY_DISABLED: '1'
          SCHEMA_DATABASE_URL: ${{ secrets.TEST_MIGRATOR_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
          EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
          SUPABASE_DB_CA_CERT_BASE64: ${{ vars.SUPABASE_DB_CA_CERT_BASE64 }}
        run: |
          test -n "$SUPABASE_DB_CA_CERT_BASE64"
          umask 077
          certificate="$RUNNER_TEMP/supabase-db-ca.pem"
          printf '%s' "$SUPABASE_DB_CA_CERT_BASE64" | base64 --decode > "$certificate"
          export NODE_EXTRA_CA_CERTS="$certificate" PGSSLROOTCERT="$certificate"
          node .github/scripts/migrate-schema.mjs test verified-releases.json database.types.ts dir:expected verified-types
          supabase gen types typescript --db-url "$SCHEMA_DATABASE_URL" --schema business_test > generated-remote.ts
          node .github/scripts/normalize-cli-types.mjs generated-remote.ts business_test verified-supabase.ts
          cmp expected/supabase.ts verified-supabase.ts
      - uses: actions/upload-artifact@v4
        with:
          name: integration-schema-evidence
          path: |
            verified-types/
            database.types.ts.manifest.json
            verified-supabase.ts
          if-no-files-found: error
  advisors:
    needs: migrate
    uses: ./.github/workflows/db-advisors.yml
    secrets: inherit
  publish:
    if: ${{ always() && !cancelled() && needs.verify.result == 'success' }}
    needs: [verify, migrate, advisors]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-integration-input
      - env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.migrate.result == 'success' && needs.advisors.result == 'success' }}
          SIGNAL_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          state=failure
          if [[ "$OUTCOME" == true ]]; then state=success; fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -er '.[].sha' verified-releases.json > shas.txt
          while IFS= read -r sha; do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
            if [[ "$state" == failure && "$sha" != "$SIGNAL_SHA" ]]; then continue; fi
            if gh api "repos/$GITHUB_REPOSITORY/commits/$sha/statuses" | jq -e 'any(.[]; .context == "integration-schema" and .state == "success" and .creator.login == "github-actions[bot]")' >/dev/null; then continue; fi
            gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" -f context=integration-schema -f target_url="$url"
          done < shas.txt
          test "$state" = success
