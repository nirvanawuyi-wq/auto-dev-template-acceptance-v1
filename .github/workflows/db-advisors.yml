name: test database advisors
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
permissions:
  contents: read
jobs:
  security:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: db-admin
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const ref = process.env.SUPABASE_PROJECT_REF;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          if (!/^[a-z0-9]{20}$/.test(ref ?? "") || !token) throw new Error("Configure the test project and read-only Advisor token");
          const response = await fetch("https://api.supabase.com/v1/projects/" + ref + "/advisors/security", {
            headers: { authorization: "Bearer " + token },
            redirect: "error", signal: AbortSignal.timeout(45_000),
          });
          if (!response.ok) throw new Error("Supabase security advisors returned HTTP " + response.status);
          const { lints } = await response.json();
          if (!Array.isArray(lints) || lints.some((lint) => !["INFO", "WARN", "ERROR"].includes(lint?.level))) {
            throw new Error("Supabase returned an unexpected response shape");
          }
          const errors = lints.filter((lint) => lint.level === "ERROR");
          console.log("Supabase security advisors: " + errors.length + " errors, " + lints.length + " total findings");
          if (errors.length) process.exitCode = 1;
          JS
